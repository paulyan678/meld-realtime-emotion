[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "meld-realtime-emotion"
version = "0.1.0"
description = "Local text and audio emotion recognition with measured utterance-level interaction"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3", "scipy>=1.12,<2", "torch>=2.6,<3",
  "transformers>=4.48,<5", "huggingface-hub>=0.27,<1",
  "safetensors>=0.4", "soundfile>=0.12,<1", "scikit-learn>=1.5,<2",
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "websockets>=14,<17", "python-multipart>=0.0.18",
  "psutil>=6", "tqdm>=4.27",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9"]

[project.scripts]
meld-emotion = "meld_emotion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
meld_emotion = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
